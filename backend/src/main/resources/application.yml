server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-in-production-min-32-bytes-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  storage:
    base-path: ${STORAGE_BASE_PATH:./uploads}
    public-path: ${STORAGE_PUBLIC_PATH:/uploads}
    max-file-size-bytes: 10485760
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif,application/pdf
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.syedhasanraihan.portfolio: INFO
